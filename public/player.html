<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лист персонажа</title>
  <link rel="stylesheet" href="char_style.css">
</head>
<body>
  <!-- БІЧНА НАВІГАЦІЯ -->
  <nav class="side-nav">
    <button class="icon-char" data-tooltip="Character" id="navChar" class="active">⚔️</button>
    <button class="icon-info" data-tooltip="Info" id="navInfo">ℹ️</button>
    <button class="icon-map" data-tooltip="Map" id="navMap">🗺️</button>
    <button class="icon-logout logout-btn" data-tooltip="Log out" id="navLogout">🚪</button>
  </nav>

  <div class="main-content">
    <!-- Форма повторного входу (прихована після авторизації) -->
    <div id="loginFormContainer">
      <h2 style="color: var(--neon-green);">Підтвердіть вхід</h2>
      <form id="loginAgainForm">
        <input type="text" id="discordName" placeholder="Ім'я в Діскорд" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit" class="neon-btn">Увійти</button>
      </form>
      <p id="loginError" style="color:red;"></p>
    </div>

    <!-- Лист персонажа (прихований до авторизації) -->
    <div id="playerContainer" style="display:none;">
      <div class="character-card">
        <div class="char-name" id="nickname"></div>
        <div class="char-class" id="characterClass"></div>

        <p>Рівень: <span id="level"></span> | Вільні очки: <span id="freePoints"></span></p>

        <!-- HP Bar (гравець бачить лише смужку та максимальне HP) -->
        <div class="bar-container">
          <div class="bar-label">HP <span id="maxHp">0</span></div>
          <div class="bar-track">
            <div class="hp-fill" id="hpBar" style="width: 0%;"></div>
          </div>
        </div>

        <!-- MP Bar -->
        <div class="bar-container">
          <div class="bar-label">MP <span id="maxMana">0</span></div>
          <div class="bar-track">
            <div class="mp-fill" id="manaBar" style="width: 0%;"></div>
          </div>
        </div>

        <!-- XP Bar -->
        <div class="bar-container">
          <div class="bar-label">XP <span id="xpNext">0</span></div>
          <div class="bar-track">
            <div class="hp-fill" id="xpBar" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Ефекти -->
        <div class="effects-container" id="effectsList"></div>

        <!-- Характеристики -->
        <h3>Характеристики</h3>
        <div id="statsList"></div>
      </div>
    </div>

    <!-- Модальне вікно для підтвердження зміни імені/класу -->
    <div class="modal" id="changeRequestModal">
      <div class="modal-content">
        <p id="changeRequestMessage"></p>
        <button class="neon-btn" id="acceptChange">Погодитися</button>
        <button class="neon-btn danger-btn" id="declineChange">Відмовитися</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
